name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run finite gates from the standalone artifact root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p025-scientific/raw"
          ulimit -t 300
          ulimit -v 4194304
          ulimit -f 131072
          timeout --signal=TERM --kill-after=10s 300s \
            python -B verify_artifact.py \
              --work-dir "$RUNNER_TEMP/p025-scientific/work" \
              --output "$RUNNER_TEMP/p025-scientific/verification.json" \
            2>&1 | tee "$RUNNER_TEMP/p025-scientific/raw/driver.txt"
      - name: Check invocation-local support setup against the literal subset oracle
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p check_prepared_support.py -v \
            2>&1 | tee "$RUNNER_TEMP/p025-scientific/raw/prepared-support.txt"
      - name: Check supplied candidates without support discovery
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p check_candidate_verification.py -v \
            2>&1 | tee "$RUNNER_TEMP/p025-scientific/raw/candidate-verification.txt"
      - name: Check complete-input structure access and invocation-local work
        shell: bash
        env:
          PYTHONPATH: src:.:tests
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p check_information_paths.py -v \
            2>&1 | tee "$RUNNER_TEMP/p025-scientific/raw/information-paths.txt"
      - name: Check owned Python source hybrids and native compiler warnings
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p check_source_bridge.py -v
          python -B -O -m unittest discover -s tests -p check_source_bridge.py -v
          timeout 30s python -B source_bridge_check.py --output "$RUNNER_TEMP/p025-scientific/source-bridge.json"
          timeout 30s python -B -O source_bridge_check.py --output "$RUNNER_TEMP/p025-scientific/source-bridge-optimized.json"
      - name: Check captured released-analyzer observations without network access
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/check_pyflakes_release.py
          python -B -O tests/check_pyflakes_release.py
          python -B integration/verify_pyflakes_release.py
      - name: Check automatic full-module comparison export and source-bound reception
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p check_whole_source.py -v
          python -O -B -m unittest discover -s tests -p check_whole_source.py -v
          timeout 120s python -B integration/pyflakes_source_study.py --fetch --wheel-dir "$RUNNER_TEMP/pyflakes-wheels" --output "$RUNNER_TEMP/p025-scientific/source-consumer"
      - name: Reconstruct source-realizable block support and captured native observations
        run: |
          python -B -m unittest discover -s tests -p check_source_pair.py -v
          python -O -B -m unittest discover -s tests -p check_source_pair.py -v
          python -B integration/check_source_pairs.py
      - name: Upload raw output and fresh results even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p025-finite-output
          path: |
            ${{ runner.temp }}/p025-scientific/raw
            ${{ runner.temp }}/p025-scientific/verification.json
            ${{ runner.temp }}/p025-scientific/work/raw
            ${{ runner.temp }}/p025-scientific/work/regenerated
            ${{ runner.temp }}/p025-scientific/source-bridge.json
            ${{ runner.temp }}/p025-scientific/source-bridge-optimized.json
            ${{ runner.temp }}/p025-scientific/source-consumer
          if-no-files-found: error
          retention-days: 14
